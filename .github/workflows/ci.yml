# Three platforms, first-class (R8.1). The unit and integration labels run
# everywhere; the system label exercises fork/exec and child capture, whose
# Windows arms are v2, so those tests are compiled out there (the label
# still runs whatever the platform compiles in).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-gcc
            os: ubuntu-24.04
            cxx: g++
            generator: Ninja
          - name: linux-clang
            os: ubuntu-24.04
            cxx: clang++
            generator: Ninja
          - name: linux-gcc-sanitizers
            os: ubuntu-24.04
            cxx: g++
            generator: Ninja
            flags: -fsanitize=address,undefined -fno-sanitize-recover=all
          - name: macos-appleclang
            os: macos-15
            cxx: clang++
            generator: Ninja
          - name: windows-msvc
            os: windows-2022
            # MSVC via the default Visual Studio generator; multi-config, so
            # the configuration is picked at build/test time.

    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Configure
        if: runner.os != 'Windows'
        env:
          CXX: ${{ matrix.cxx }}
        run: >
          cmake -S . -B build -G "${{ matrix.generator }}"
          -DCMAKE_BUILD_TYPE=Debug
          ${{ matrix.flags && format('-DCMAKE_CXX_FLAGS="{0}"', matrix.flags) || '' }}

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build --config Debug

      - name: Test
        run: ctest --test-dir build -C Debug --output-on-failure

  examples:
    # Examples are consumer code and rot silently if nobody builds them, so
    # CI builds the ladder and runs every one of them unattended.
    name: examples
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
          -DSUB0LOG_BUILD_EXAMPLES=ON
      - name: Build
        run: cmake --build build
      - name: Run the ladder
        run: ctest --test-dir build -L example --output-on-failure

  linux-gcc-m32:
    # The 32-bit arm, and it exists because of one specific claim. A pointer
    # is eight bytes on the wire on every target, so that TypeCode::Pointer
    # means one width to a reader that may well be 64-bit reading what a
    # 32-bit producer wrote. Before that was true the encoder wrote
    # sizeof(uintptr_t) and the concept refused pointers wherever that was
    # not 8, which made a 32-bit build impossible to log a pointer from --
    # and the change fixing it could only be reasoned about locally, because
    # no 32-bit toolchain was available there. This job is what turns it
    # from reasoned into verified, and it is the whole suite rather than a
    # compile check because word size reaches further than one concept:
    # atomics, mmap, off_t and thread ids all narrow here too.
    name: linux-gcc-m32
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install a 32-bit toolchain
        run: sudo apt-get update && sudo apt-get install -y ninja-build g++-multilib
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS=-m32
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  packaging:
    # find_package(Sub0Log) is real infrastructure (docs/adoption-friction.md
    # 1.1), not something to trust by reading the CMakeLists.txt: this job
    # builds the library, then drives tests/packaging/drive.cmake, which
    # installs it to a throwaway prefix and configures a from-scratch
    # consumer project against nothing but that prefix. Ubuntu is the
    # minimum; Windows is included too because install-prefix path bugs
    # (backslashes, case, multi-config output dirs) are the ones that hide
    # on Linux and surface there, and the test itself runs in low single-
    # digit seconds so the second platform costs almost nothing.
    name: packaging-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@v4
      - name: Install Ninja (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure
        if: runner.os != 'Windows'
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: cmake -S . -B build
      - name: Build
        run: cmake --build build --config Debug
      - name: Run the packaging test
        run: ctest --test-dir build -C Debug -L packaging --output-on-failure

  stress-quick:
    # The stress harness asserts invariants under load rather than measuring,
    # so unlike the KPI numbers it *is* a legitimate pass/fail gate. --quick
    # keeps it to the smallest scale that still exercises every invariant.
    name: stress-quick
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DSUB0LOG_BUILD_BENCHMARKS=ON -DSUB0LOG_BUILD_TESTING=OFF
      - name: Build
        run: cmake --build build
      - name: Stress (quick)
        run: ./build/benchmarks/Sub0LogStress --quick

  benchmarks-smoke:
    # Keeps the KPI suite compiling and runnable. Deliberately not a
    # pass/fail number gate: shared CI runners produce noisy timings, and a
    # noisy gate teaches people to ignore it. Numbers come from deliberate
    # runs on known hardware (benchmarks/README.md).
    name: benchmarks-smoke
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DSUB0LOG_BUILD_BENCHMARKS=ON -DSUB0LOG_BUILD_TESTING=OFF
      - name: Build
        run: cmake --build build
      - name: Smoke
        run: ./build/benchmarks/Sub0LogBenchmarks --list

  coverage:
    # Measures real line coverage from an actual --coverage build and, on
    # main only, publishes it as a badge -- an unmeasured coverage number
    # would be exactly the kind of unverified claim this project's own docs
    # argue against everywhere else (docs/adoption-friction.md's whole
    # method is "measured, not guessed"). Runs the full suite, unfiltered,
    # so the published test count is produced by the same run that produces
    # the coverage number, not a separate hand-maintained figure.
    #
    # The badges themselves are shields.io "endpoint" badges reading a JSON
    # file this job commits to an orphan `badges` branch with the default
    # GITHUB_TOKEN -- no external account, no repo secret, nothing that can
    # silently stop working because a third-party service or token expired.
    name: coverage
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - run: pip install --quiet gcovr

      - name: Configure (instrumented)
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="--coverage -O0"
          -DCMAKE_EXE_LINKER_FLAGS="--coverage"

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure | tee ctest-output.txt

      - name: Measure coverage
        id: coverage
        # Scoped to the library's own headers and the shipped tool -- not
        # the vendored doctest/nanobench trees under build/_deps, and not
        # tests/packaging's consumer fixtures, which are fresh uninstrumented
        # cmake configures of their own (drive.cmake, drive_cpm.cmake) and
        # contribute no .gcda here regardless.
        run: >
          gcovr --root . --filter 'include/sub0log/.*' --filter 'tools/.*'
          -e 'build/_deps/.*' build
          --print-summary --xml coverage.xml --html-details coverage-html/index.html
          | tee gcovr-output.txt

          echo "percent=$(grep -oP 'lines: \K[0-9.]+' gcovr-output.txt)" >> "$GITHUB_OUTPUT"

      - name: Parse test count
        id: tests
        run: |
          line=$(grep -E '% tests passed' ctest-output.txt)
          echo "total=$(echo "$line" | grep -oP 'out of \K[0-9]+')" >> "$GITHUB_OUTPUT"
          echo "failed=$(echo "$line" | grep -oP '\K[0-9]+(?= tests failed)')" >> "$GITHUB_OUTPUT"

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: coverage-html

      - name: Write badge JSON
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          COVERAGE_PERCENT: ${{ steps.coverage.outputs.percent }}
          TESTS_TOTAL: ${{ steps.tests.outputs.total }}
          TESTS_FAILED: ${{ steps.tests.outputs.failed }}
        run: |
          python3 - <<'PY'
          import json, os

          pct = float(os.environ["COVERAGE_PERCENT"])
          color = ("red" if pct < 50 else "orange" if pct < 70 else
                   "yellow" if pct < 80 else "yellowgreen" if pct < 90 else
                   "brightgreen")
          json.dump({"schemaVersion": 1, "label": "coverage",
                      "message": f"{pct:.0f}%", "color": color},
                     open("coverage.json", "w"))

          total = int(os.environ["TESTS_TOTAL"])
          failed = int(os.environ["TESTS_FAILED"])
          message = f"{total} passing" if failed == 0 else f"{total - failed}/{total} passing"
          json.dump({"schemaVersion": 1, "label": "tests", "message": message,
                      "color": "brightgreen" if failed == 0 else "red"},
                     open("tests.json", "w"))
          PY

      - name: Publish badges branch
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          rm -rf /tmp/badges-branch && mkdir -p /tmp/badges-branch
          cd /tmp/badges-branch
          git init -q
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q origin badges 2>/dev/null; then
            git checkout -q badges
          else
            git checkout -q --orphan badges
          fi
          cp "${GITHUB_WORKSPACE}/coverage.json" "${GITHUB_WORKSPACE}/tests.json" .
          git add coverage.json tests.json
          git commit -q -m "Update badges [skip ci]" || echo "no badge change"
          git push -q origin badges
